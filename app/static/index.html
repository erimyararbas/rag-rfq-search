<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ similarity search</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e1e5ec; --accent:#2f5bd8; --err:#b42318; --errbg:#fef3f2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:24px; margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  #query { flex:1 1 420px; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; }
  label { color:var(--muted); font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  select, input[type=number] { padding:7px 8px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  input[type=number] { width:64px; }
  button { padding:9px 16px; font-size:14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button:disabled { opacity:.55; cursor:default; }
  #status { color:var(--muted); margin:0 0 12px; min-height:1.4em; }
  #error { display:none; background:var(--errbg); color:var(--err); border:1px solid #fecdca; border-radius:8px; padding:10px 14px; margin-bottom:18px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  #answer p { margin:0 0 10px; white-space:pre-wrap; }
  #answer h2 { font-size:16px; margin:0 0 10px; }
  #answer ul { margin:6px 0 12px; padding-left:20px; color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>RFQ similarity search</h1>

  <div class="card">
    <div class="row">
      <input id="query" type="text" placeholder="Describe the part or request, e.g. milled aluminium housing 6061" autofocus>
      <button id="searchBtn" type="button">Search</button>
      <button id="askBtn" type="button" class="secondary">Ask (Claude)</button>
    </div>
    <div class="row" style="margin-top:12px">
      <label>Mode
        <select id="mode">
          <option value="hybrid" selected>hybrid</option>
          <option value="dense">dense</option>
          <option value="lexical">lexical</option>
        </select>
      </label>
      <label><input id="rerank" type="checkbox"> Rerank (slow, CPU)</label>
      <label>k <input id="k" type="number" min="1" max="20" value="5"></label>
    </div>
  </div>

  <p id="status" role="status"></p>
  <div id="error" role="alert"></div>

  <div id="answerCard" class="card hidden">
    <div id="answer"></div>
  </div>

  <div id="resultsCard" class="card hidden">
    <table>
      <thead><tr>
        <th class="num">Rank</th><th>RFQ id</th><th>Title</th><th>Customer</th><th>Status</th><th class="num">Score</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var busy = false;

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = String(text);
    if (cls) e.className = cls;
    return e;
  }

  function showError(msg) {
    var box = $("error");
    box.textContent = msg;
    box.style.display = msg ? "block" : "none";
  }

  function detailText(body, status) {
    var d = body && body.detail;
    if (typeof d === "string") return d;
    if (Array.isArray(d)) {
      return "Invalid request: " + d.map(function (x) {
        var loc = Array.isArray(x.loc) ? x.loc.filter(function (p) { return p !== "body"; }).join(".") : "";
        return (loc ? loc + ": " : "") + (x.msg || "invalid value");
      }).join("; ");
    }
    return "Request failed (HTTP " + status + ")";
  }

  function setBusy(on, label) {
    busy = on;
    $("searchBtn").disabled = on;
    $("askBtn").disabled = on;
    $("status").textContent = on ? label : "";
  }

  function reset() {
    showError("");
    $("answerCard").classList.add("hidden");
    $("resultsCard").classList.add("hidden");
  }

  function readK() {
    var k = parseInt($("k").value, 10);
    if (isNaN(k)) k = 5;
    return Math.min(20, Math.max(1, k));
  }

  async function call(path, payload, label) {
    if (busy) return null;
    var query = $("query").value.trim();
    if (!query) { reset(); showError("Enter a query first."); return null; }
    payload.query = query;
    reset();
    setBusy(true, label);
    var t0 = performance.now();
    var res = null, body = null, netErr = null;
    try {
      res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      try { body = await res.json(); } catch (e) { body = null; }
    } catch (e) {
      netErr = e;
    }
    var ms = Math.round(performance.now() - t0);
    setBusy(false);
    $("status").textContent = "Done in " + ms + " ms";
    if (netErr) { showError("Network error: " + netErr.message); return null; }
    if (!res.ok) {
      if (path === "/ask" && res.status === 503) {
        showError("API key not configured: /ask needs ANTHROPIC_API_KEY. Search still works.");
      } else {
        showError(detailText(body, res.status));
      }
      return null;
    }
    return body;
  }

  async function doSearch() {
    var body = await call("/search", {
      k: readK(), mode: $("mode").value, rerank: $("rerank").checked
    }, "Searching…");
    if (!body) return;
    var rows = $("rows");
    rows.textContent = "";
    var results = body.results || [];
    results.forEach(function (h, i) {
      var tr = document.createElement("tr");
      tr.appendChild(el("td", i + 1, "num"));
      tr.appendChild(el("td", h.rfq_id));
      tr.appendChild(el("td", h.title));
      tr.appendChild(el("td", h.customer));
      tr.appendChild(el("td", h.status));
      var s = typeof h.score === "number" ? h.score.toFixed(3) : "";
      tr.appendChild(el("td", s, "num"));
      rows.appendChild(tr);
    });
    if (!results.length) {
      var tr = document.createElement("tr");
      var td = el("td", "No results.");
      td.colSpan = 6;
      tr.appendChild(td);
      rows.appendChild(tr);
    }
    $("resultsCard").classList.remove("hidden");
  }

  async function doAsk() {
    var body = await call("/ask", { k: readK() }, "Asking Claude…");
    if (!body) return;
    var box = $("answer");
    box.textContent = "";
    box.appendChild(el("h2", "Answer"));
    box.appendChild(el("p", body.answer));
    var sources = body.sources || [];
    if (sources.length) {
      var ul = el("ul");
      box.appendChild(el("div", "Sources"));
      sources.forEach(function (s) { ul.appendChild(el("li", s.rfq_id + (s.title ? " — " + s.title : ""))); });
      box.appendChild(ul);
    }
    var cites = body.citations || [];
    if (cites.length) {
      var cl = el("ul");
      box.appendChild(el("div", "Citations"));
      cites.forEach(function (c) { cl.appendChild(el("li", c.rfq_id + (c.cited_text ? ": " + c.cited_text : ""))); });
      box.appendChild(cl);
    }
    $("answerCard").classList.remove("hidden");
  }

  $("searchBtn").addEventListener("click", doSearch);
  $("askBtn").addEventListener("click", doAsk);
  $("query").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });
})();
</script>
</body>
</html>
