services:
  db:
    image: pgvector/pgvector:pg17
    shm_size: 1gb  # parallel HNSW builds use shared memory sized by maintenance_work_mem
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./eval/results:/app/eval/results
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
  hf_cache:
